<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Transcriber</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5f6b7a;
      --border: #dde2e8;
      --accent: #2f6fed;
      --accent-text: #ffffff;
      --ok: #1f8a4c;
      --err: #c62f2f;
      --drop: #eef3fe;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1a1e24;
        --text: #e6e9ed;
        --muted: #9aa5b1;
        --border: #2d333b;
        --accent: #5b8cff;
        --accent-text: #0b1020;
        --ok: #4cc67f;
        --err: #ff6b6b;
        --drop: #1d2635;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 6px 16px 32px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0;
    }

    .sub {
      color: var(--muted);
      margin: 2px 0 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button.small {
      padding: 4px 10px;
      font-size: 0.85rem;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .remove {
      border: none;
      background: none;
      color: var(--muted);
      padding: 0 4px;
      font-size: 1.2rem;
      line-height: 1;
    }

    .hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 6px 0 0;
    }

    .drop {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .drop.over,
    .drop:hover {
      background: var(--drop);
      border-color: var(--accent);
    }

    .drop strong {
      display: block;
      font-size: 1.05rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 0 8px 6px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .col-file {
      width: 9%;
    }

    /* Shrinks to fit the video. */
    .col-preview {
      width: 1%;
    }

    /* Video height is worked out from the screen height so at least 3 rows fit:
       (screen - header and table top) / 3 rows - (skip buttons + row padding). */
    .col-preview video {
      height: clamp(100px, calc((100vh - 84px) / 3 - 46px), 360px);
      width: auto;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }

    /* Captions over the video. The browser's default size is too small on these small players.
       Edge and Chrome only take the size from their own -webkit- rule; ::cue is for Firefox.
       Each selector needs its own rule, because a browser drops any rule with a selector it doesn't know. */
    .col-preview video::-webkit-media-text-track-container {
      font-size: 16px !important;
    }

    .col-preview video:fullscreen::-webkit-media-text-track-container {
      font-size: 32px !important;
    }

    .col-preview video::cue {
      font-size: 16px;
    }

    .col-preview video:fullscreen::cue {
      font-size: 32px;
    }

    .skip {
      margin-top: 4px;
      gap: 4px;
      flex-wrap: nowrap;
      justify-content: center;
    }

    .skip button {
      white-space: nowrap;
      padding: 2px 8px;
      font-size: 0.8rem;
    }

    /* Lets the transcript box stretch to the same height as the video beside it. */
    .col-text {
      height: 1px;
    }

    .col-status {
      width: 12%;
    }

    .file-name {
      font-weight: 600;
      word-break: break-all;
    }

    .file-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .size {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .msg {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .msg.wait {
      color: var(--muted);
      font-weight: 400;
    }

    .msg.err {
      color: var(--err);
    }

    .msg.ok {
      color: var(--ok);
    }

    .bar {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
      display: none;
    }

    .bar.show {
      display: block;
    }

    .bar>div {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.2s;
    }

    .bar.busy>div {
      width: 35%;
      animation: slide 1.2s infinite ease-in-out;
    }

    @keyframes slide {
      from {
        margin-left: -35%;
      }

      to {
        margin-left: 100%;
      }
    }

    .elapsed {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
    }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 60px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: vertical;
    }

    .text-cell {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    /* Same size as the skip buttons, so both sit on the same line at the bottom of the row. */
    button.copy {
      flex: none;
      padding: 2px 8px;
      font-size: 0.8rem;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px 0;
    }

    /* On phones, each row becomes a stacked card. */
    @media (max-width: 720px) {

      thead {
        display: none;
      }

      table,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      tr {
        border-bottom: 1px solid var(--border);
        padding: 8px 0;
      }

      td {
        border: none;
        padding: 6px 0;
      }

      .col-file,
      .col-preview,
      .col-status,
      .col-text {
        width: 100%;
        height: auto;
      }

      .col-preview video {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="top">
      <div>
        <h1>Video Transcriber</h1>
        <p class="sub" id="sub">Add up to 15 videos, transcribe them all at once, and copy the text from each row.</p>
        <p class="hint" id="note"></p>
      </div>
      <div class="row" id="actions">
        <button class="small primary" id="go" disabled>Transcribe all</button>
        <button class="small" id="clear" disabled>Clear list</button>
      </div>
    </header>

    <section class="card" id="picker">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose video or audio files">
        <strong>Drop videos here, or click to choose</strong>
        <span class="hint">Up to 15 files · MP4, MOV, MKV, WEBM, MP3, WAV, M4A…</span>
      </div>
      <input type="file" id="file" accept="video/*,audio/*" multiple hidden>
    </section>

    <section class="card">
      <table>
        <thead>
          <tr>
            <th class="col-file">Video</th>
            <th class="col-preview">Preview</th>
            <th class="col-status">Status</th>
            <th class="col-text">Transcript</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="4" class="empty">No videos added yet.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const API = 'https://api.assemblyai.com/v2';
    const $ = id => document.getElementById(id);

    // Paste the AssemblyAI API key here once.
    const ASSEMBLYAI_KEY = '88e7e255a592447fa252a8d48fe19c96';

    const MAX_FILES = 15;
    // Only this many files upload at the same time, so they don't all fight for the same internet connection.
    const MAX_UPLOADS = 3;

    // One entry per table row: { file, state, text, tr }. state is 'waiting', 'working', 'done' or 'error'.
    const jobs = [];
    let uploadsRunning = 0;
    const uploadQueue = [];

    // Picking files: by click, keyboard, or drag and drop.
    const drop = $('drop');
    drop.onclick = () => $('file').click();
    drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
    $('file').onchange = () => { addFiles($('file').files); $('file').value = ''; };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = e => {
      e.preventDefault();
      drop.classList.remove('over');
      addFiles(e.dataTransfer.files);
    };

    function addFiles(list) {
      const room = MAX_FILES - jobs.length;
      const files = [...list].slice(0, room);
      const skipped = list.length - files.length;
      $('note').textContent = skipped > 0 ? `Only ${MAX_FILES} videos fit in the list, so ${skipped} file(s) were left out.` : '';
      files.forEach(f => {
        const job = { file: f, state: 'waiting', text: '' };
        job.tr = buildRow(job);
        jobs.push(job);
      });
      render();
    }

    function buildRow(job) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="col-file">
          <div class="file-head">
            <div class="file-name"></div>
            <button class="remove" title="Remove this video" aria-label="Remove this video">×</button>
          </div>
          <div class="size">${(job.file.size / 1024 / 1024).toFixed(1)} MB</div>
        </td>
        <td class="col-preview">
          <video controls preload="metadata"></video>
          <div class="row skip">
            <button class="small" data-skip="-5" title="Back 5 seconds">« 5s</button>
            <button class="small" data-skip="-2" title="Back 2 seconds">« 2s</button>
            <button class="small" data-skip="2" title="Forward 2 seconds">2s »</button>
            <button class="small" data-skip="5" title="Forward 5 seconds">5s »</button>
          </div>
        </td>
        <td class="col-status">
          <div class="msg wait">Waiting to start</div>
          <div class="bar"><div></div></div>
          <div class="elapsed"></div>
        </td>
        <td class="col-text">
          <div class="text-cell">
            <textarea spellcheck="false" placeholder="The transcript will appear here."></textarea>
            <button class="small copy" disabled>Copy text</button>
          </div>
        </td>`;
      tr.querySelector('.file-name').textContent = job.file.name;
      // The preview plays straight from the file on this computer, nothing is downloaded.
      job.url = URL.createObjectURL(job.file);
      const video = tr.querySelector('video');
      // Jump half a second in, so the preview shows a real frame instead of a black first frame.
      video.onloadedmetadata = () => { if (video.currentTime === 0) video.currentTime = Math.min(0.5, video.duration || 0); };
      // Only one video plays at a time: starting one pauses the rest.
      video.onplay = () => jobs.forEach(j => { if (j !== job) j.tr.querySelector('video').pause(); });
      video.src = job.url;
      tr.querySelectorAll('[data-skip]').forEach(btn => {
        btn.onclick = () => {
          const to = video.currentTime + Number(btn.dataset.skip);
          video.currentTime = Math.max(0, Math.min(to, video.duration || to));
        };
      });
      tr.querySelector('.remove').onclick = () => {
        URL.revokeObjectURL(job.url);
        jobs.splice(jobs.indexOf(job), 1);
        render();
      };
      const copyBtn = tr.querySelector('.copy');
      copyBtn.onclick = () => copyText(tr.querySelector('textarea').value, copyBtn);
      return tr;
    }

    // Redraw the table body and set which buttons can be clicked.
    function render() {
      const body = $('rows');
      body.innerHTML = '';
      if (!jobs.length) {
        body.innerHTML = '<tr><td colspan="4" class="empty">No videos added yet.</td></tr>';
      }
      jobs.forEach(j => {
        j.tr.querySelector('.remove').style.visibility = j.state === 'working' ? 'hidden' : '';
        body.appendChild(j.tr);
      });
      const busy = jobs.some(j => j.state === 'working');
      $('go').disabled = !jobs.some(j => j.state === 'waiting' || j.state === 'error');
      $('clear').disabled = !jobs.length || busy;
      // Before any videos are added only the picker shows; after, only the buttons.
      $('picker').style.display = jobs.length ? 'none' : '';
      $('sub').style.display = jobs.length ? 'none' : '';
      $('actions').style.display = jobs.length ? '' : 'none';
    }

    function setStatus(job, text, kind = '', progress = null) {
      const msg = job.tr.querySelector('.msg');
      const bar = job.tr.querySelector('.bar');
      msg.textContent = text;
      msg.className = 'msg ' + kind;
      bar.classList.toggle('show', !kind);
      bar.classList.toggle('busy', progress === null && !kind);
      bar.firstElementChild.style.width = progress === null ? '' : progress + '%';
    }

    // Step 1: send one file to AssemblyAI. XMLHttpRequest is used because it reports upload progress.
    function upload(job) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', API + '/upload');
        xhr.setRequestHeader('authorization', ASSEMBLYAI_KEY);
        xhr.upload.onprogress = e => {
          if (e.lengthComputable) {
            const pct = Math.round(e.loaded / e.total * 100);
            setStatus(job, `Uploading… ${pct}%`, '', pct);
          }
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText).upload_url);
          else reject(new Error(readError(xhr.status, xhr.responseText)));
        };
        xhr.onerror = () => reject(new Error('Network error while uploading.'));
        xhr.send(job.file);
      });
    }

    // Waits for a free upload slot, uploads, then frees the slot for the next file.
    async function uploadWhenFree(job) {
      if (uploadsRunning >= MAX_UPLOADS) {
        setStatus(job, 'In line to upload…', 'wait');
        await new Promise(r => uploadQueue.push(r));
      }
      uploadsRunning++;
      try {
        setStatus(job, 'Uploading… 0%', '', 0);
        return await upload(job);
      } finally {
        uploadsRunning--;
        const next = uploadQueue.shift();
        if (next) next();
      }
    }

    function readError(status, body) {
      try { return JSON.parse(body).error || `Request failed (${status})`; }
      catch { return status === 401 ? 'The API key was not accepted.' : `Request failed (${status})`; }
    }

    async function api(path, options = {}) {
      const res = await fetch(API + path, {
        ...options,
        headers: { authorization: ASSEMBLYAI_KEY, 'content-type': 'application/json' },
      });
      const body = await res.text();
      if (!res.ok) throw new Error(readError(res.status, body));
      return JSON.parse(body);
    }

    async function run(job) {
      job.state = 'working';
      render();
      const start = Date.now();
      const elapsed = job.tr.querySelector('.elapsed');
      const timer = setInterval(() => {
        const s = Math.floor((Date.now() - start) / 1000);
        elapsed.textContent = `Time so far: ${Math.floor(s / 60)}m ${s % 60}s`;
      }, 1000);

      try {
        const audioUrl = await uploadWhenFree(job);

        // Step 2: ask AssemblyAI to transcribe the uploaded file.
        setStatus(job, 'Transcribing…');
        const request = { audio_url: audioUrl, language_code: 'en', speaker_labels: false };
        const created = await api('/transcript', { method: 'POST', body: JSON.stringify(request) });

        // Step 3: check every 5 seconds until it is done.
        let t = created;
        while (t.status !== 'completed' && t.status !== 'error') {
          await new Promise(r => setTimeout(r, 5000));
          t = await api('/transcript/' + created.id);
        }
        if (t.status === 'error') throw new Error(t.error || 'Transcription failed.');

        job.text = t.text || '(No speech was found in this file.)';
        job.tr.querySelector('textarea').value = job.text;
        showCaptions(job, t.words || []);
        job.tr.querySelector('.copy').disabled = false;
        job.state = 'done';
        setStatus(job, 'Done', 'ok');
      } catch (e) {
        job.state = 'error';
        setStatus(job, e.message + ' Click "Transcribe all" to try again.', 'err');
      } finally {
        clearInterval(timer);
        render();
      }
    }

    // Groups the transcript's timed words into short captions.
    function buildCaptions(words) {
      const MAX_CHARS = 64;
      const PAUSE_MS = 1500;

      // First split into phrases at the end of each sentence and at long pauses.
      const phrases = [];
      let phrase = [];
      for (const w of words) {
        const last = phrase[phrase.length - 1];
        if (last && (/[.?!]$/.test(last.text) || w.start - last.end > PAUSE_MS)) {
          phrases.push(phrase);
          phrase = [];
        }
        phrase.push(w);
      }
      if (phrase.length) phrases.push(phrase);

      // Then cut long phrases into pieces of about equal length, so no caption is left with just a word or two.
      const cues = [];
      for (const words of phrases) {
        const total = words.reduce((n, w) => n + w.text.length + 1, 0);
        const count = Math.ceil(total / MAX_CHARS);
        const pieces = [];
        let pos = 0;
        for (const w of words) {
          const i = Math.min(count - 1, Math.floor((pos + w.text.length / 2) / (total / count)));
          (pieces[i] = pieces[i] || []).push(w);
          pos += w.text.length + 1;
        }
        pieces.filter(Boolean).forEach(p => cues.push({
          start: p[0].start,
          end: p[p.length - 1].end,
          text: p.map(w => w.text).join(' '),
        }));
      }
      // Keep each caption up to 1 second longer so it can be read, without overlapping the next one.
      cues.forEach((c, i) => { c.end = Math.min(c.end + 1000, cues[i + 1] ? cues[i + 1].start : Infinity); });
      return cues;
    }

    // Shows the captions on the row's video. They can be turned off with the player's CC button.
    function showCaptions(job, words) {
      const video = job.tr.querySelector('video');
      job.track = job.track || video.addTextTrack('captions', 'English', 'en');
      job.track.mode = 'showing';
      [...job.track.cues].forEach(c => job.track.removeCue(c));
      buildCaptions(words).forEach(c => job.track.addCue(new VTTCue(c.start / 1000, c.end / 1000, c.text)));
    }

    // Starts every row that hasn't finished yet. Failed rows are tried again.
    $('go').onclick = () => {
      jobs.filter(j => j.state === 'waiting' || j.state === 'error').forEach(run);
    };

    $('clear').onclick = () => {
      jobs.forEach(j => URL.revokeObjectURL(j.url));
      jobs.length = 0;
      $('note').textContent = '';
      render();
    };

    async function copyText(text, btn) {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const t = document.createElement('textarea');
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        t.remove();
      }
      const label = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = label, 1500);
    }

    render();
  </script>
</body>

</html>
